<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slide-menu {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }
        .slide-menu.open {
            transform: translateX(0);
        }
        .modal {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .modal.open {
            opacity: 1;
            visibility: visible;
        }
        .backdrop-blur {
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Header -->
    <header class="flex justify-between items-center p-4">
        <!-- Menu Button -->
        <button id="menuBtn" class="p-2 hover:bg-gray-800 rounded-lg transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Right Side Buttons -->
        <div class="flex items-center gap-4">
            <button id="loginBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">
                登录
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex flex-col items-center justify-center min-h-[80vh] px-4">
        <!-- Logo/Icon -->
        <div class="mb-8">
            <svg class="h-16 w-16 text-white" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.5 14.5a.5.5 0 11-1 0 .5.5 0 011 0zM12 11.5a.5.5 0 11-1 0 .5.5 0 011 0zM14.5 14.5a.5.5 0 11-1 0 .5.5 0 011 0z" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M12 21a9 9 0 100-18 9 9 0 000 18z" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M12 14v-1.155a3 3 0 011.5-2.598M12 14l-.94-1.88a1 1 0 00-1.78-.22M12 14l.94-1.88a1 1 0 011.78-.22M15 17h.01M9 17h.01M12 6h.01" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M15 20c1.09-.32 2.09-.89 2.94-1.65M9 20c-1.09-.32-2.09-.89-2.94-1.65" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
        </div>

        <!-- Title -->
        <h1 class="text-3xl font-bold mb-8 text-center">开始你的求知探索之旅……</h1>

        <!-- Search Box -->
        <div class="w-full max-w-2xl">
            <div class="relative">
                <input 
                    type="text" 
                    placeholder="输入你想搜索的内容..."
                    class="w-full px-6 py-4 bg-gray-800 border border-gray-700 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all"
                >
                <button class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Search Suggestions -->
        <div class="mt-8 flex flex-wrap gap-3 justify-center">
            <button class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-full text-sm transition-colors">热门搜索</button>
            <button class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-full text-sm transition-colors">最新资讯</button>
            <button class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-full text-sm transition-colors">技术文档</button>
            <button class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-full text-sm transition-colors">学习资源</button>
        </div>
    </main>

    <!-- Side Menu -->
    <div id="sideMenu" class="slide-menu fixed top-0 left-0 w-80 h-full bg-gray-800 z-50 p-6">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-bold">菜单</h2>
            <button id="closeMenuBtn" class="p-2 hover:bg-gray-700 rounded-lg transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <nav class="space-y-4">
            <a href="#" class="block px-4 py-3 hover:bg-gray-700 rounded-lg transition-colors">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    历史记录
                </div>
            </a>
            <a href="#" class="block px-4 py-3 hover:bg-gray-700 rounded-lg transition-colors">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                    </svg>
                    收藏夹
                </div>
            </a>
            <a href="#" class="block px-4 py-3 hover:bg-gray-700 rounded-lg transition-colors">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    设置
                </div>
            </a>
            <a href="#" class="block px-4 py-3 hover:bg-gray-700 rounded-lg transition-colors">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    帮助
                </div>
            </a>
        </nav>
    </div>

    <!-- Menu Overlay -->
    <div id="menuOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 opacity-0 invisible transition-all duration-300"></div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal fixed inset-0 bg-black bg-opacity-50 backdrop-blur z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 rounded-2xl p-8 w-full max-w-md relative">
            <!-- Close Button -->
            <button id="closeModalBtn" class="absolute top-4 right-4 p-2 hover:bg-gray-700 rounded-lg transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <!-- Title -->
            <h2 class="text-2xl font-bold text-center mb-2">登录账户</h2>
            <p class="text-gray-400 text-center mb-8">登录以保存搜索历史和个人设置</p>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <input 
                        type="text" 
                        id="username"
                        placeholder="用户名"
                        class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all"
                        required
                    >
                </div>
                <div>
                    <input 
                        type="password" 
                        id="password"
                        placeholder="密码"
                        class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all"
                        required
                    >
                </div>
                <button 
                    type="submit"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition-colors"
                >
                    登录
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center my-6">
                <div class="flex-1 border-t border-gray-600"></div>
                <span class="px-4 text-gray-400 text-sm">或</span>
                <div class="flex-1 border-t border-gray-600"></div>
            </div>

            <!-- Google Login -->
            <button class="w-full py-3 bg-white text-gray-900 rounded-lg font-medium hover:bg-gray-100 transition-colors flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                使用 Google 登录
            </button>

            <!-- Footer -->
            <p class="text-center text-sm text-gray-400 mt-6">
                使用即表示同意我们的 
                <a href="#" class="text-blue-400 hover:underline">服务条款</a> 
                和 
                <a href="#" class="text-blue-400 hover:underline">隐私政策</a>
            </p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 right-4 bg-gray-800 text-white px-6 py-4 rounded-lg shadow-lg transform transition-transform duration-300 translate-x-full">
        <div class="flex items-center gap-3">
            <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span id="toastMessage">登录成功！</span>
        </div>
    </div>

    <script>
        // Menu functionality
        const menuBtn = document.getElementById('menuBtn');
        const sideMenu = document.getElementById('sideMenu');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const menuOverlay = document.getElementById('menuOverlay');

        function openMenu() {
            sideMenu.classList.add('open');
            menuOverlay.style.opacity = '1';
            menuOverlay.style.visibility = 'visible';
        }

        function closeMenu() {
            sideMenu.classList.remove('open');
            menuOverlay.style.opacity = '0';
            menuOverlay.style.visibility = 'hidden';
        }

        menuBtn.addEventListener('click', openMenu);
        closeMenuBtn.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);

        // Modal functionality
        const loginBtn = document.getElementById('loginBtn');
        const loginModal = document.getElementById('loginModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function openModal() {
            loginModal.classList.add('open');
        }

        function closeModal() {
            loginModal.classList.remove('open');
        }

        loginBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        loginModal.addEventListener('click', (e) => {
            if (e.target === loginModal) {
                closeModal();
            }
        });

        // Search functionality
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                if (query) {
                    alert(`搜索: ${query}`);
                }
            }
        });

        // Escape key to close modals
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeMenu();
            }
        });

        // Login functionality
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!username || !password) {
                showToast('请填写用户名和密码', false);
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8080/api/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    // 登录成功
                    showToast('登录成功！', true);
                    // 清空表单
                    loginForm.reset();
                    // 延迟关闭模态框
                    setTimeout(() => {
                        closeModal();
                    }, 1500);
                } else {
                    // 登录失败
                    showToast(result.message || '登录失败', false);
                }
            } catch (error) {
                console.error('登录错误:', error);
                showToast('网络错误，请稍后重试', false);
            }
        });

        // Toast notification function
        function showToast(message, isSuccess) {
            toastMessage.textContent = message;
            
            // 设置样式
            if (isSuccess) {
                toast.querySelector('svg').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
                toast.querySelector('svg').classList.add('text-green-500');
                toast.querySelector('svg').classList.remove('text-red-500');
            } else {
                toast.querySelector('svg').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>';
                toast.querySelector('svg').classList.add('text-red-500');
                toast.querySelector('svg').classList.remove('text-green-500');
            }
            
            // 显示 toast
            toast.classList.remove('translate-x-full');
            toast.classList.add('translate-x-0');
            
            // 3秒后隐藏
            setTimeout(() => {
                toast.classList.remove('translate-x-0');
                toast.classList.add('translate-x-full');
            }, 3000);
        }
    </script>
</body>
</html>
