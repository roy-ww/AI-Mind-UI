<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>思维导图布局演示（横向，根在左）</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>思维导图布局演示</h1>
      <div class="meta">横向布局 · 自动折行 · 兄弟最小间隔、父节点垂直居中 · 点击徽标折叠/展开</div>
      <button id="resetBtn" class="btn" title="重置示例数据">重置</button>
      <button id="randomBtn" class="btn" title="随机切换若干节点折叠状态">随机折叠/展开</button>
      <span class="flex-1"></span>
      <button id="zoomOutBtn" class="btn" title="缩小">-</button>
      <button id="zoomResetBtn" class="btn" title="重置缩放">100%</button>
      <button id="zoomInBtn" class="btn" title="放大">+</button>
    </header>
    <div class="stage">
      <svg id="canvas" viewBox="0 0 1200 800" preserveAspectRatio="xMinYMin meet"></svg>
      <div class="legend">拖拽平移：按住空白区域拖拽；支持缩放（+ / - / 100%）。</div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
