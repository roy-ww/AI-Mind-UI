<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>

</div>
<div id="tipsContainer" class="mt-4 hidden">
<div id="tipsMessage" class="text-sm text-gray-400"></div>
</div>
</main>
<footer class="w-full p-6">
<div class="flex justify-center items-end space-x-4 overflow-x-auto pb-4">

<img alt="Astronaut on the moon" class="w-40 h-24 object-cover rounded-lg transform hover:scale-105 transition-transform duration-300" src="img/astronaut-moon.jpg"/>
<img alt="Portrait of a woman" class="w-40 h-24 object-cover rounded-lg transform hover:scale-105 transition-transform duration-300" src="img/portrait-woman.jpg"/>

<img alt="Painting of a room with people" class="w-40 h-24 object-cover rounded-lg transform hover:scale-105 transition-transform duration-300" src="img/room-people.jpg"/>
