server:
  port: 8080

spring:
  application:
    name: ai-mind-backend
  
  profiles:
    include: secret
  
  datasource:
    url: jdbc:postgresql://localhost:5432/aimind_db
    username: ${DB_USERNAME:aimind_user}
    password: ${DB_PASSWORD:aimind_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.aimind.backend: DEBUG
    org.springframework.web: DEBUG